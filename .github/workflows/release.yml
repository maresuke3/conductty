name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      platform:
        description: "Target platform(s) to build and release"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan Release Matrix
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sums: ${{ steps.meta.outputs.sums }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Determine release tag and target matrix
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PLAT="${{ inputs.platform }}"
          else
            TAG="${GITHUB_REF_NAME}"
            case "${TAG}" in
              *-windows) PLAT="windows" ;;
              *-macos)   PLAT="macos" ;;
              *-linux)   PLAT="linux" ;;
              *)         PLAT="all" ;;
            esac
          fi
          if [ "${PLAT}" = "all" ]; then
            SUMS="SHA256SUMS.txt"
          else
            SUMS="SHA256SUMS-${PLAT}.txt"
          fi

          LINUX='{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","archive":"tar.gz"}'
          MAC_ARM='{"target":"aarch64-apple-darwin","os":"macos-latest","archive":"tar.gz"}'
          MAC_X64='{"target":"x86_64-apple-darwin","os":"macos-latest","archive":"tar.gz"}'
          WIN='{"target":"x86_64-pc-windows-msvc","os":"windows-latest","archive":"zip"}'

          case "${PLAT}" in
            linux)   MATRIX="{\"include\":[${LINUX}]}" ;;
            macos)   MATRIX="{\"include\":[${MAC_ARM},${MAC_X64}]}" ;;
            windows) MATRIX="{\"include\":[${WIN}]}" ;;
            *)       MATRIX="{\"include\":[${LINUX},${MAC_ARM},${MAC_X64},${WIN}]}" ;;
          esac

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sums=${SUMS}" >> "$GITHUB_OUTPUT"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin conductty --bin conductty-server

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          STAGE="conductty-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/conductty" "dist/${STAGE}/"
          cp "target/${{ matrix.target }}/release/conductty-server" "dist/${STAGE}/"
          cp config.conductty README.md "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Package macOS .app and .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          BASE_VER="${TAG#v}"
          BASE_VER="${BASE_VER%-macos}"
          APP_DIR="dist/Conductty.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp "target/${{ matrix.target }}/release/conductty" "${APP_DIR}/Contents/MacOS/"
          cp "target/${{ matrix.target }}/release/conductty-server" "${APP_DIR}/Contents/MacOS/"

          ICONSET="dist/AppIcon.iconset"
          mkdir -p "${ICONSET}"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz assets/app-logo.png --out "${ICONSET}/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            sips -z $sz2 $sz2 assets/app-logo.png --out "${ICONSET}/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "${ICONSET}" -o "${APP_DIR}/Contents/Resources/AppIcon.icns"
          rm -rf "${ICONSET}"

          cat > "${APP_DIR}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Conductty</string>
            <key>CFBundleDisplayName</key><string>Conductty</string>
            <key>CFBundleIdentifier</key><string>dev.conductty.app</string>
            <key>CFBundleVersion</key><string>${BASE_VER}</string>
            <key>CFBundleShortVersionString</key><string>${BASE_VER}</string>
            <key>CFBundleExecutable</key><string>conductty</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          chmod +x "${APP_DIR}/Contents/MacOS/"*
          codesign --force --deep --sign - "${APP_DIR}"

          STAGE_DIR="dist/dmg-${{ matrix.target }}"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"
          cp -R "${APP_DIR}" "${STAGE_DIR}/"
          ln -s /Applications "${STAGE_DIR}/Applications"

          hdiutil create -volname "Conductty" -srcfolder "${STAGE_DIR}" -ov -format UDZO "dist/Conductty-${TAG}-${{ matrix.target }}.dmg"

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ needs.plan.outputs.tag }}"
          $stage = "conductty-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/conductty.exe" "dist/$stage/"
          Copy-Item "target/${{ matrix.target }}/release/conductty-server.exe" "dist/$stage/"
          $webviewDll = Get-ChildItem -Path "target/${{ matrix.target }}/release/build" -Filter "WebView2Loader.dll" -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($webviewDll) {
            Copy-Item $webviewDll.FullName "dist/$stage/"
          }
          Copy-Item "config.conductty", "README.md" "dist/$stage/"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg

  release:
    name: Create GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          FILES=(*.tar.gz *.zip *.dmg)
          if [ ${#FILES[@]} -gt 0 ]; then
            sha256sum "${FILES[@]}" > "${{ needs.plan.outputs.sums }}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS*.txt
