[workspace]
resolver = "2"
members = [
    "crates/term-core",
    "crates/term-render",
    "crates/term-drawer",
    "crates/term-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
cosmic-text = "0.12"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
toml = "0.8"
vte = "0.15"
wgpu = "24.0"
winit = "0.30"
