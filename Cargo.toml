[workspace]
resolver = "2"
members = [
    "crates/term-core",
    "crates/term-render",
    "crates/term-drawer",
    "crates/term-mux",
    "crates/term-app",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
arboard = "3.4"
base64 = "0.22"
bytemuck = { version = "1.21", features = ["derive"] }
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
toml = "0.8"
vte = "0.15"
wgpu = "30.0"
winit = "0.30"
wry = "0.57"
